<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Nota - Beautiful Notes</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="manifest" href="manifest.json"/>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23636f' stroke-width='2'%3E%3Cpath d='M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z'/%3E%3Cpolyline points='14 2 14 8 20 8'/%3E%3Cline x1='16' y1='13' x2='8' y2='13'/%3E%3Cline x1='16' y1='17' x2='8' y2='17'/%3E%3C/svg%3E"/>
  <style>
    .note-card { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
    .note-card:hover { transform: translateY(-4px); box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1); }
    .markdown-preview { font-size: 0.95rem; line-height: 1.6; }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen">
  <div class="max-w-7xl mx-auto flex h-screen">
    <!-- Sidebar -->
    <div class="w-80 border-r border-zinc-800 flex flex-col">
      <div class="p-6 border-b border-zinc-800">
        <div class="flex items-center gap-3">
          <div class="w-9 h-9 bg-violet-600 rounded-xl flex items-center justify-center text-xl">📝</div>
          <h1 class="text-3xl font-bold tracking-tight">nota</h1>
        </div>
        <p class="text-zinc-500 text-sm mt-1">your thoughts, anywhere</p>
      </div>

      <div class="p-4">
        <button onclick="newNote()" 
                class="w-full bg-violet-600 hover:bg-violet-500 py-3 rounded-2xl font-medium flex items-center justify-center gap-2 transition">
          <span class="text-xl">+</span> New Note
        </button>
      </div>

      <div class="px-4 mb-2">
        <input type="text" id="search" 
               placeholder="Search notes..." 
               onkeyup="filterNotes()"
               class="w-full bg-zinc-900 border border-zinc-700 rounded-2xl px-4 py-3 text-sm focus:outline-none focus:border-violet-500"/>
      </div>

      <div id="notes-list" class="flex-1 overflow-y-auto px-3 space-y-1"></div>

      <div class="p-4 border-t border-zinc-800 text-xs text-zinc-500 flex justify-between">
        <div>💾 <span id="count">0</span> notes</div>
        <button onclick="exportNotes()" class="hover:text-zinc-300">Export</button>
        <button onclick="importNotes()" class="hover:text-zinc-300">Import</button>
      </div>
    </div>

    <!-- Editor -->
    <div class="flex-1 flex flex-col">
      <div id="empty-state" class="flex-1 flex items-center justify-center text-center">
        <div>
          <div class="text-6xl mb-4">📝</div>
          <h2 class="text-2xl font-medium text-zinc-400">Select or create a note</h2>
        </div>
      </div>

      <div id="editor" class="hidden flex-1 flex flex-col">
        <div class="p-6 border-b border-zinc-800 flex items-center gap-4">
          <input id="title" 
                 class="flex-1 bg-transparent text-2xl font-semibold focus:outline-none"
                 placeholder="Note title..."/>
          <button onclick="deleteCurrentNote()" 
                  class="text-red-400 hover:text-red-500 px-4 py-2 rounded-xl transition">Delete</button>
          <button onclick="saveNote()" 
                  class="bg-emerald-600 hover:bg-emerald-500 px-6 py-2 rounded-2xl font-medium transition">Save</button>
        </div>

        <div class="flex-1 flex">
          <!-- Markdown Editor -->
          <textarea id="content" 
                    class="flex-1 bg-zinc-900 p-6 font-mono text-sm resize-none focus:outline-none"
                    placeholder="Write in markdown..."></textarea>
          
          <!-- Live Preview -->
          <div id="preview" 
               class="flex-1 p-6 border-l border-zinc-800 markdown-preview prose prose-invert max-w-none overflow-auto">
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
